<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="상승률">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>상승률 계산기</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --line: #334155;
    --text: #f1f5f9; --sub: #94a3b8;
    --up: #ef4444; --down: #3b82f6; --flat: #94a3b8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif; }
  body { min-height: 100vh; display: flex; justify-content: center; padding: 24px 16px; }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 20px; margin: 8px 0 20px; text-align: center; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .row label { width: 76px; font-size: 16px; color: var(--sub); flex-shrink: 0; }
  .field { flex: 1; display: flex; align-items: center; gap: 8px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; }
  .field:focus-within { border-color: #64748b; }
  .field input { flex: 1; min-width: 0; background: none; border: 0; outline: 0;
    color: var(--text); font-size: 22px; font-weight: 600; text-align: right; padding: 14px 0; }
  .field input::placeholder { color: #475569; }
  .unit { color: var(--sub); font-size: 16px; }
  .result { border-top: 1px dashed var(--line); padding-top: 18px; }
  .result .value { flex: 1; text-align: right; font-size: 30px; font-weight: 700; color: var(--flat); }
  .result.up .value { color: var(--up); }
  .result.down .value { color: var(--down); }
  .diff { text-align: right; font-size: 14px; color: var(--sub); margin-top: -8px; min-height: 18px; }
  button { margin-top: 16px; width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--line);
    background: transparent; color: var(--sub); font-size: 16px; }
  button:active { background: var(--card); }
</style>
</head>
<body>
<main>
  <h1>📈 상승률 계산기</h1>
  <div class="card">
    <div class="row">
      <label for="buy">매수가격</label>
      <div class="field"><input id="buy" type="text" inputmode="decimal" placeholder="0000" autocomplete="off"><span class="unit">원</span></div>
    </div>
    <div class="row">
      <label for="sell">매도가격</label>
      <div class="field"><input id="sell" type="text" inputmode="decimal" placeholder="0000" autocomplete="off"><span class="unit">원</span></div>
    </div>
    <div class="row result" id="result">
      <label>상승률</label>
      <div class="value" id="rate">—</div>
      <span class="unit">%</span>
    </div>
    <div class="diff" id="diff"></div>
  </div>
  <button id="reset" type="button">초기화</button>
</main>

<script>
const buy = document.getElementById('buy');
const sell = document.getElementById('sell');
const rate = document.getElementById('rate');
const diff = document.getElementById('diff');
const result = document.getElementById('result');

function toNum(s) {
  const n = parseFloat(String(s).replace(/,/g, ''));
  return isNaN(n) ? null : n;
}

// 입력 중 천 단위 콤마 자동 표시 (소수점도 허용)
function format(el) {
  let v = el.value.replace(/[^0-9.]/g, '');
  const parts = v.split('.');
  if (parts.length > 2) v = parts[0] + '.' + parts.slice(1).join('');
  const [int, dec] = v.split('.');
  let out = (int || '').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  if (v.includes('.')) out += '.' + (dec || '');
  el.value = out;
}

function calc() {
  const b = toNum(buy.value), s = toNum(sell.value);
  result.classList.remove('up', 'down');
  if (b === null || s === null || b === 0) {
    rate.textContent = '—';
    diff.textContent = '';
    return;
  }
  const r = (s - b) / b * 100;
  const d = s - b;
  const sign = r > 0 ? '+' : '';
  rate.textContent = sign + r.toFixed(2);
  diff.textContent = '손익 ' + (d > 0 ? '+' : '') + d.toLocaleString('ko-KR') + '원 (매수 대비)';
  if (r > 0) result.classList.add('up');
  else if (r < 0) result.classList.add('down');
}

[buy, sell].forEach(el => el.addEventListener('input', () => { format(el); calc(); }));
document.getElementById('reset').addEventListener('click', () => {
  buy.value = ''; sell.value = ''; calc(); buy.focus();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
